<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' blob:; base-uri 'none'; form-action 'none'"
    />
    <title>Claude Skin Switcher</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- drag strip for the frameless window; controls on top of it are no-drag -->
    <div class="drag-strip" aria-hidden="true"></div>
    <div class="app">
      <aside class="sidebar">
        <div class="brand"><img class="brand-icon" src="assets/icon-64.png" alt="" draggable="false" /><span id="app-name"></span></div>
        <div id="library-label" class="side-label"></div>
        <div id="lib-list" class="theme-list" role="listbox"></div>
        <!-- pinned to the bottom; the library list above shrinks and scrolls -->
        <div class="side-bottom">
          <div id="browse-label" class="side-label"></div>
          <nav class="nav-list">
            <button id="nav-gallery" class="row nav-row" type="button" data-view="gallery">
              <span class="nav-icon" aria-hidden="true">
                <svg viewBox="0 0 16 16"><rect x="2" y="2" width="5" height="5" rx="1" /><rect x="9" y="2" width="5" height="5" rx="1" /><rect x="2" y="9" width="5" height="5" rx="1" /><rect x="9" y="9" width="5" height="5" rx="1" /></svg>
              </span>
              <span id="nav-gallery-label" class="row-name"></span>
            </button>
            <button id="nav-upload" class="row nav-row" type="button" data-view="upload">
              <span class="nav-icon" aria-hidden="true">
                <svg viewBox="0 0 16 16"><path d="M8 11V3M4.5 6.5 8 3l3.5 3.5M3 13h10" /></svg>
              </span>
              <span id="nav-upload-label" class="row-name"></span>
            </button>
            <button id="nav-settings" class="row nav-row" type="button" data-view="settings">
              <span class="nav-icon" aria-hidden="true">
                <svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.2" /><path d="M8 1.8v1.7M8 12.5v1.7M14.2 8h-1.7M3.5 8H1.8M12.4 3.6l-1.2 1.2M4.8 11.2l-1.2 1.2M12.4 12.4l-1.2-1.2M4.8 4.8 3.6 3.6" /><circle cx="8" cy="8" r="4.5" /></svg>
              </span>
              <span id="nav-settings-label" class="row-name"></span>
              <span id="settings-dot" class="draft-dot attn-dot" hidden></span>
            </button>
          </nav>
        </div>
      </aside>

      <main class="main">
        <!-- one skin: from the library, Claude default, or a gallery detail -->
        <section id="view-skin" class="view">
          <button id="back" class="back-link" type="button" hidden></button>
          <header class="main-head">
            <div class="head-text">
              <h1 id="skin-name" class="theme-name"></h1>
              <p id="skin-desc" class="theme-desc"></p>
            </div>
            <div class="head-actions">
              <span id="confirm" class="confirm" role="status"></span>
              <div class="segmented" role="radiogroup">
                <button id="mode-dark" type="button" role="radio" data-mode="dark"></button>
                <button id="mode-light" type="button" role="radio" data-mode="light"></button>
              </div>
              <button id="report" class="ghost head-ghost" type="button" hidden></button>
              <button id="delete" class="ghost head-ghost subtle-danger" type="button" hidden></button>
              <button id="discard" class="ghost head-ghost" type="button" hidden></button>
              <button id="apply" class="primary" type="button"></button>
            </div>
          </header>
          <div id="ask" class="ask" hidden>
            <span id="ask-text"></span>
            <button id="ask-yes" class="ghost danger" type="button"></button>
            <button id="ask-no" class="tiny-link" type="button"></button>
          </div>
          <div id="tabs" class="tabs" role="tablist">
            <button id="tab-overview" type="button" role="tab" data-tab="overview"></button>
            <button id="tab-tune" type="button" role="tab" data-tab="tune"></button>
            <button id="tab-code" type="button" role="tab" data-tab="code"></button>
          </div>

          <div id="skin-body" class="skin-body">
            <div class="stage-col">
              <div class="stage">
                <div id="preview" class="preview">
                  <img id="scene" class="scene" alt="" hidden />
                  <div class="mock">
                    <div class="mock-side glass">
                      <span class="bar w70"></span>
                      <span class="bar w50"></span>
                      <span class="bar w80"></span>
                      <span class="bar w40"></span>
                      <span class="bar w60"></span>
                    </div>
                    <div class="mock-main glass">
                      <div class="mock-thread">
                        <p id="mock-text" class="mock-text"></p>
                        <div class="mock-tool"><span class="tool-name">Bash</span><span>npm test -- --runInBand</span></div>
                        <div class="mock-user"><span id="mock-user" class="bubble"></span></div>
                      </div>
                      <div id="mock-input" class="mock-input"></div>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <div id="pane-overview" class="pane">
              <dl id="details" class="details"></dl>
            </div>
            <div id="pane-tune" class="pane tune" hidden>
              <p id="tune-note" class="pane-note"></p>
              <div id="tune-groups"></div>
              <div class="tune-foot">
                <button id="reset" class="ghost" type="button"></button>
                <button id="save-new" class="ghost" type="button"></button>
              </div>
              <form id="new-form" class="new-form" hidden>
                <label><span id="new-name-label"></span><input id="new-name" type="text" maxlength="40" /></label>
                <label><span id="new-slug-label"></span><input id="new-slug" type="text" maxlength="40" spellcheck="false" /></label>
                <p id="new-error" class="error-text" hidden></p>
                <div class="form-actions">
                  <button id="new-save" class="primary small" type="submit"></button>
                  <button id="new-cancel" class="tiny-link" type="button"></button>
                </div>
              </form>
            </div>
            <div id="pane-code" class="pane code-pane" hidden>
              <p id="code-check" class="code-check" role="status"></p>
              <ul id="code-errors" class="error-list" hidden></ul>
              <p id="code-note" class="pane-note"></p>
              <section class="code-file">
                <div class="code-head">
                  <h2 class="code-title">skin.json</h2>
                  <span id="code-skin-count" class="muted-text num"></span>
                  <button id="code-skin-copy" class="tiny-link code-copy" type="button"></button>
                </div>
                <pre class="code-block"><code id="code-skin"></code></pre>
              </section>
              <section class="code-file">
                <div class="code-head">
                  <h2 class="code-title">scene.svg</h2>
                  <span id="code-scene-count" class="muted-text num"></span>
                  <button id="code-scene-copy" class="tiny-link code-copy" type="button"></button>
                </div>
                <pre id="code-scene-pre" class="code-block"><code id="code-scene"></code></pre>
                <p id="code-no-scene" class="muted-text" hidden></p>
              </section>
            </div>
          </div>

          <div id="broken" class="broken" hidden>
            <p id="broken-text" class="broken-text"></p>
            <ul id="broken-list" class="error-list"></ul>
          </div>
        </section>

        <section id="view-gallery" class="view" hidden>
          <header class="main-head">
            <div class="head-text">
              <h1 id="gallery-title" class="theme-name"></h1>
              <p id="gallery-sub" class="theme-desc"></p>
            </div>
          </header>
          <div class="toolbar">
            <input id="search" class="search" type="search" spellcheck="false" />
            <div class="segmented" role="radiogroup">
              <button id="sort-new" type="button" role="radio" data-sort="new"></button>
              <button id="sort-popular" type="button" role="radio" data-sort="popular"></button>
            </div>
            <button id="tag" class="select dropdown" type="button"></button>
          </div>
          <div id="grid-wrap" class="grid-wrap">
            <div id="grid" class="grid"></div>
            <p id="grid-state" class="grid-state" hidden></p>
            <div class="grid-more">
              <button id="grid-retry" class="ghost" type="button" hidden></button>
              <button id="load-more" class="ghost" type="button" hidden></button>
            </div>
          </div>
        </section>

        <section id="view-upload" class="view" hidden>
          <header class="main-head">
            <div class="head-text">
              <h1 id="upload-title" class="theme-name"></h1>
              <p id="upload-sub" class="theme-desc"></p>
            </div>
          </header>
          <div class="upload-scroll">
            <dl class="details upload-table">
              <dt id="up-account-key"></dt>
              <dd id="up-account" class="stack"></dd>
              <dt id="up-source-key"></dt>
              <dd class="stack">
                <div class="inline">
                  <button id="up-folder" class="ghost flat" type="button"></button>
                  <button id="up-library" class="select dropdown" type="button"></button>
                </div>
                <span id="up-source" class="muted-text"></span>
              </dd>
              <dt id="up-checks-key"></dt>
              <dd class="stack">
                <ul id="up-checks" class="error-list"></ul>
                <div class="inline">
                  <button id="up-send" class="primary small" type="button"></button>
                  <span id="up-result" class="muted-text" role="status"></span>
                </div>
                <span id="up-rules" class="muted-text small-text"></span>
              </dd>
              <dt id="up-mine-key" hidden></dt>
              <dd id="up-mine" class="stack" hidden></dd>
            </dl>
          </div>
        </section>
        <section id="view-settings" class="view" hidden>
          <header class="main-head">
            <div class="head-text">
              <h1 id="settings-title" class="theme-name"></h1>
              <p id="settings-sub" class="theme-desc"></p>
            </div>
          </header>
          <div class="settings-scroll">
            <h2 id="sec-connection" class="set-heading"></h2>
            <dl class="details set-table">
              <dt id="set-status-key"></dt>
              <dd>
                <span class="bridge-status">
                  <span id="bridge-dot" class="status-dot" aria-hidden="true"></span>
                  <span id="bridge-text" class="bridge-text"></span>
                </span>
                <span id="bridge-error" class="bridge-error" hidden></span>
              </dd>
              <dt id="set-plugin-key"></dt>
              <dd><span id="bridge-sub" class="bridge-sub"></span></dd>
              <dt id="set-install-key"></dt>
              <dd class="stack">
                <button id="install" class="ghost flat" type="button" hidden>
                  <span class="spinner" aria-hidden="true"></span>
                  <span id="install-label"></span>
                </button>
                <p id="install-ok" class="install-ok" hidden></p>
                <details id="install-details" class="install-details" hidden>
                  <summary id="install-summary"></summary>
                  <p id="install-text" class="install-text"></p>
                  <pre id="manual-text" class="code" hidden></pre>
                  <button id="manual-copy" class="tiny-link" type="button" hidden></button>
                  <pre id="install-log" class="code log"></pre>
                </details>
              </dd>
            </dl>
            <p id="set-connection-help" class="set-help"></p>

            <h2 id="sec-account" class="set-heading"></h2>
            <dl class="details set-table">
              <dt id="set-google-key"></dt>
              <dd>
                <span id="set-account"></span>
                <button id="set-account-btn" class="ghost flat" type="button"></button>
              </dd>
            </dl>

            <h2 id="sec-about" class="set-heading"></h2>
            <dl class="details set-table">
              <dt id="set-app-key"></dt>
              <dd id="set-app-name"></dd>
              <dt id="set-version-key"></dt>
              <dd id="set-version"></dd>
              <dt id="set-source-key"></dt>
              <dd><button id="repo" class="tiny-link set-link" type="button"></button></dd>
            </dl>
            <p id="footer-text" class="set-help"></p>
          </div>
        </section>
      </main>
    </div>
    <script src="../src/skin-render.js"></script>
    <script src="../src/drafts.js"></script>
    <script src="../src/color.js"></script>
    <script src="../src/backdrop.js"></script>
    <script src="picker.js"></script>
    <script src="dropdown.js"></script>
    <script src="renderer.js"></script>
  </body>
</html>
