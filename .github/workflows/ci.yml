name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      # Tests cover main-process modules only; no Electron binary needed.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      - run: npm test

  # The skin validator (shared/) and the gallery Worker (server/) have no
  # dependencies; their tests use node:test and node:sqlite (Node 22.13+).
  shared-and-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: shared/
        working-directory: shared
        run: node --test test/*.test.js

      - name: server/
        working-directory: server
        run: node --test test/*.test.js
