name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    env:
      # Unsigned builds: no code-signing identity lookup, no notarization.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Add the Google sign-in secret
        shell: bash
        env:
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          test -n "$GOOGLE_CLIENT_SECRET" || { echo "GOOGLE_CLIENT_SECRET repo secret is missing"; exit 1; }
          node -e 'require("fs").writeFileSync("src/google-secret.json", JSON.stringify({ secret: process.env.GOOGLE_CLIENT_SECRET }) + "\n")'

      # One invocation builds arm64 and x64 (dmg + zip), so a single
      # latest-mac.yml lists both zips. The zips and latest*.yml are what the
      # in-app updater downloads and verifies (src/updater.js).
      - name: Build macOS installers
        if: runner.os == 'macOS'
        run: npm run dist:mac

      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: npm run dist:win

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          path: |
            app/dist/*.dmg
            app/dist/*.zip
            app/dist/*.exe
            app/dist/latest*.yml
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: installers
          merge-multiple: true

      - name: Attach installers to the release for this tag
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installers/*.dmg
            installers/*.zip
            installers/*.exe
            installers/latest-mac.yml
            installers/latest.yml
          fail_on_unmatched_files: true
